experience:
  - org: Ember
    url: https://ember-energy.org
    roles:
      - title: Data Engineer
        start: 2023
        end: 2024
      - title: Senior Data Engineer
        start: 2024
    summary: |
      - Own engineering workstreams at Ember including:
        - Ember's data orchestration platform in dagster
          - I have also [contributed to the open-source project](https://github.com/dagster-io/dagster/pulls?q=is%3Apr+author%3Aj-blackwell)
            and developed two open-source plugins [dagster-db](https://github.com/j-blackwell/dagster-db)
            and [dagster-ibis](https://github.com/ember-energy/dagster-ibis).
          - Implemented bespoke and generalised testing and validation of data assets; extensive metadata
            collection to enable improved data cataloguing; improving team best practices; and onboarding
            team members onto the dagster platform and implementing feedback to improve developer experience.
        - Data access platforms including an [API](https://ember-energy.org/data/api), public data hub and
          internal MCP.
          - Including databases, deployment, CICD, monitoring (performance and errors).
          - Developed a strong understanding of the opportunities to productionise AI, and where it should
            not be used (yet?).
      - Lead a small team of 5 mixed-experience, multi-discipline engineers, providing various levels of
        support, mentoring and encouragement.
        - Lead regular forums on knowledge sharing and best practices, embracing and encouraging use of
          AI workflows once verifying that output is consistently high quality.
        - Lead recruitment round for role with over 1100 applicants, managing the resultant pressures.
        - Project manage projects including planning and managing team resource.
        - Qualified Mental Health First Aider and member of wellbeing working group.
      - Contributed to organisation AI and data team strategies, and supported funding applications.
    details: |
      - Project managed the migration from our legacy codebase to the dagster platform (2025).
      - Running production data pipelines on schedules / sensors since early 2024, processing datasets at a
        rate and scale that was previously infeasible.
      - Moved our database to bigquery to help future-proof and enable reporting of finer-grain datasets.
      - Provided data and feedback on the [Electricity Data Explorer](https://ember-energy.org/data/electricity-data-explorer/).
      - Ran an organisation-wide pilot program of AI tooling (2025).

