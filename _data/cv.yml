projects:
  - name: CADA network
    url: https://autonomy.work/cada/
    summary: Former contributor to the CADA network.
    details: |
      Previously, I have been a very active member of the CADA network, where I helped design and build
      a dataset of council spending data in order to assess the impact of outsourcing and consultancy
      on local government spending. Inspired by [Mariana Mazzucato and Rosie Collington](https://en.wikipedia.org/wiki/The_Big_Con_(Mazzucato_and_Collington_book)),
      we wrote a paper called the [London Big Con](https://autonomy.work/portfolio/the-london-big-con/)
      which was picked up by the [Guardian](https://www.theguardian.com/society/2025/dec/06/london-councils-warning-structurally-dependent-on-private-firms-as-report-shows-500m-spend).
  - name: Open source
    summary: >-
      The open-source philosophy is something incredibly valuable and something like it is rare in the modern world.
      I don't contribute to it as much as I would like. However, I have contributed to the `dagster`
      open-source ecosystem, and have a couple of other projects on pypi.
  - name: Hobby programming
    url: https://github.com/j-blackwell
    summary: >-
      I have also played around with some toy programming projects, and have learnt a bit of Lua and JavaScript.
    details: |
      I have dabbled in Lua and JavaScript and would welcome any opportunities to work with some non-python
      technologies / frameworks.

      I've played around with some toy programming projects:
        - creating a [smart mirror](https://github.com/jrstats/pymirror) in python
        - setting up email notifications whenever Brentford FC [tweet about tickets going on sale](https://github.com/jrstats/twitterNotifications)
        - [optimising the Formula 1 calendar](https://github.com/jrstats/f1calendar/blob/master/solution.ipynb) to
        reduce its emissions.
  - name: Hyprland and Neovim
