tagline: Senior Data Engineer at [Ember](https://ember-energy.org)

# Full profile only
profile: |
  I'm a python software engineer with experience in data science, data engineering and platform
  architecture mainly in the water and energy industry.
  I like building things related to data and hate doing things manually!
  But I also like doing things the right way, using best practices and the right tool for the job.

  I am passionate about the environment and other societal issues, and I'm motivated to use my skills
  in the most valuable way to contribute towards these causes.

  I am also an active contributor to the [CADA network](https://autonomy.work/cada/).

